name: Official PortableApps 3.9.24 - Real Headless Build Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-official.ps1'
      - 'scripts/generate-official-config.py'
      - 'tests/test-official.ps1'
      - 'third_party/portableapps-installer-3.9.24/**'
      - '.github/workflows/official-smoke-test.yml'
permissions:
  contents: read
jobs:
  official-and-custom-compile:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4
      - name: Verify Python and vendored official compiler
        shell: pwsh
        run: |
          python --version
          if (-not (Test-Path 'third_party/portableapps-installer-3.9.24/App/nsis/makensis.exe')) { throw 'Bundled NSIS missing' }
      - name: Install custom NSIS compiler if needed (not for official engine)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Custom engine NSIS setup failed' }
          }
      - name: Full headless official and custom installer compile
        shell: pwsh
        run: '& ./tests/test-official.ps1'
      - name: Upload diagnostic compiler logs if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portableapps-official-3_9_24-diagnostics
          path: official-smoke-diagnostics/*.log
          if-no-files-found: warn
          retention-days: 7
