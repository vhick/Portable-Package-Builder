name: Offline Official Source - Guard and Optional Integration Test
on:
  workflow_dispatch:
    inputs:
      official-source-dir:
        description: 'Optional complete GENERATED PortableApps.com Installer Other/Source folder. Blank runs guard test only; full official test requires application-matched template.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  source-guard-or-integration:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout portable package builder
        uses: actions/checkout@v4
      - name: Install NSIS compiler if absent
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install NSIS' }
          }
      - name: Run offline packaging guard or full source compile
        shell: pwsh
        env:
          OFFICIAL_SOURCE_DIR: ${{ inputs.official-source-dir }}
        run: '& ./tests/test-official.ps1 -OfficialSourceDir $env:OFFICIAL_SOURCE_DIR'
      - name: Upload source compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-official-source-diagnostics
          path: |
            official-smoke-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 5
