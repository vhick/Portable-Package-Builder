name: Universal Packager Self-Test
on:
  workflow_dispatch:
jobs:
  nsis-tests:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run fast static contract checks
        shell: pwsh
        run: |
          python ./tests/test-static.py
          python ./tests/test-official-config.py
      - name: Syntax parse all PowerShell scripts
        shell: pwsh
        run: |
          $errorsFound = 0
          Get-ChildItem scripts,tests -Recurse -Filter '*.ps1' | ForEach-Object {
            $errors = $null; $tokens = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            foreach ($parseError in $errors) { Write-Error "${_}: $parseError" -ErrorAction Continue; $errorsFound++ }
          }
          if ($errorsFound) { throw "PowerShell parser errors: $errorsFound" }
      - name: Install NSIS when missing
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'NSIS dependency install failed' }
          }
      - name: Test fresh installation, upgrade cleanup, preservation, rollback, refusal of unrelated targets
        shell: pwsh
        run: '& ./tests/test-installer.ps1'
